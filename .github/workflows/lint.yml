name: Lint

on:
  push:
  pull_request:

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if ($results | Where-Object Severity -in 'Warning', 'Error') {
              throw "PSScriptAnalyzer found issues"
          }
